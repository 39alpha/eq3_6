name: Create Snapshots

on:
  push:
    branches: [ "**" ]

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - name: apt-get install fd-find
      run: |
        sudo apt-get install fd-find
        mkdir -p ~/.local/bin
        ln -s $(which fdfind) ~/.local/bin/fd
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just snapshot
      run: just snapshot ubuntu-latest
    - name: archive snapshots
      uses: actions/upload-artifact@v7
      with:
        name: ubuntu-latest
        path: test/data/snapshots/ubuntu-latest
        retention-days: 2

  ubuntu-26-arm:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - name: apt-get install fd-find
      run: |
        sudo apt-get install fd-find
        mkdir -p ~/.local/bin
        ln -s $(which fdfind) ~/.local/bin/fd
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just snapshot
      run: just snapshot ubuntu-26-arm
    - name: archive snapshots
      uses: actions/upload-artifact@v7
      with:
        name: ubuntu-26-arm
        path: test/data/snapshots/ubuntu-26-arm
        retention-days: 2

  macos-26-intel:
    runs-on: macos-26-intel
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel fd
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just snapshot macos-26-intel
      run: just snapshot macos-26-intel
    - name: archive snapshots
      uses: actions/upload-artifact@v7
      with:
        name: macos-26-intel
        path: test/data/snapshots/macos-26-intel
        retention-days: 2

  macos-latest:
    runs-on: macos-latest
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel fd
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: make snapshot
      run: just snapshot macos-latest
    - name: archive snapshots
      uses: actions/upload-artifact@v7
      with:
        name: macos-latest
        path: test/data/snapshots/macos-latest
        retention-days: 2
