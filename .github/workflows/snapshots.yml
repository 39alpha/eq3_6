name: snapshots

on:
  push:
    branches: [ "**" ]

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: install meson
      run: python -m pip install meson
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just snapshot
      run: just snapshot
    - name: archive snapshots
      uses: actions/upload-artifact@v7
      with:
        name: ubuntu-latest
        path: test/data/snapshots/amd64
        retention-days: 2

  ubuntu-26-arm:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: install meson
      run: python -m pip install meson
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just snapshot
      run: just snapshot
    - name: archive snapshots
      uses: actions/upload-artifact@v7
      with:
        name: ubuntu-26-arm
        path: test/data/snapshots/arm64
        retention-days: 2

  macos-26-intel:
    runs-on: macos-26-intel
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: install meson
      run: python -m pip install meson
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel fd
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just snapshot
      run: just snapshot
    - name: archive snapshots
      uses: actions/upload-artifact@v7
      with:
        name: macos-26-intel
        path: test/data/snapshots/i386
        retention-days: 2

  macos-latest:
    runs-on: macos-latest
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: install meson
      run: python -m pip install meson
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel fd
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: make snapshot
      run: just snapshot
    - name: archive snapshots
      uses: actions/upload-artifact@v7
      with:
        name: macos-latest
        path: test/data/snapshots/arm64
        retention-days: 2
