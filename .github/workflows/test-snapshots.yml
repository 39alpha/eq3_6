name: Test Snapshots

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just test
      run: TERM=dumb just test-snapshots ubuntu-latest --jobs=4

  ubuntu-26-arm:
    runs-on: ubuntu-latest
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just test
      run: TERM=dumb just test-snapshots ubuntu-26-arm --jobs=4

  macos-26-intel:
    runs-on: macos-15-intel
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel flock
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just test
      run: TERM=dumb just test-snapshots macos-26-intel --jobs=4

  macos-latest:
    runs-on: macos-latest
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel flock
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just test
      run: TERM=dumb just test-snapshots macos-latest --jobs=3
