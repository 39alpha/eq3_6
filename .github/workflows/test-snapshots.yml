name: Test Snapshots

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  linux:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{matrix.os}}
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just test
      run: TERM=dumb just test-snapshots ${{matrix.os}}

  macos:
    strategy:
      matrix:
        os: [macos-latest, macos-26-intel]
    runs-on: ${{matrix.os}}
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel flock
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just test
      run: TERM=dumb just test-snapshots ${{matrix.os}}

  windows:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{matrix.os}}
    steps:
    - uses: extractions/setup-just@v4
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: install meson
      run: python -m pip install meson
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: just test
      run: just test-snapshots ${{matrix.os}}
