name: tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2
    - name: git submodule init
      run: git submodule init
    - name: git submodule update
      run: git submodule update
    - name: just test
      run: just test

  ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v2
    - name: git submodule init
      run: git submodule init
    - name: git submodule update
      run: git submodule update
    - name: just test
      run: just test

  ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: git submodule init
      run: git submodule init
    - name: git submodule update
      run: git submodule update
    - name: just test
      run: just test

  macos-14:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v2
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel
    - name: git submodule init
      run: git submodule init
    - name: git submodule update
      run: git submodule update
    - name: just test
      run: just test

  macos-15-intel:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v2
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel
    - name: git submodule init
      run: git submodule init
    - name: git submodule update
      run: git submodule update
    - name: just test
      run: just test

  macos-latest:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: brew reinstall gcc coreutils parallel
      run: brew reinstall gcc coreutils parallel
    - name: git submodule init
      run: git submodule init
    - name: git submodule update
      run: git submodule update
    - name: just test
      run: just test
